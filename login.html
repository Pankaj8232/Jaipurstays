<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login - JaipurStays</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="header">
  <div class="container navbar">

    <a href="index.html" class="logo">
      <span class="logo-icon">J</span>
      <span>Jaipur<span class="logo-highlight">Stays</span></span>
    </a>

    <a href="index.html" class="back-link">
      ← Back to JaipurStays
    </a>

  </div>
</header>


<main class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="auth-icon">
        J
      </div>

      <span class="eyebrow">
        PG OWNER ACCOUNT
      </span>

      <h1>Welcome to JaipurStays</h1>

      <p>
        Login or create an account to manage your PG listings.
      </p>

    </div>


    <div class="auth-tabs">

      <button class="tab active" id="loginTab">
        Login
      </button>

      <button class="tab" id="signupTab">
        Create Account
      </button>

    </div>


    <form class="auth-form" id="loginForm">

      <div class="field">

        <label for="loginPhone">
          Phone Number
        </label>

        <input
          type="tel"
          id="loginPhone"
          placeholder="Enter your phone number"
          required
        >

      </div>


      <div class="field">

        <label for="loginPassword">
          Password
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          required
        >

      </div>


      <div class="form-row">

        <label class="remember">
          <input type="checkbox">
          <span>Remember me</span>
        </label>

        <a href="#" class="forgot">
          Forgot password?
        </a>

      </div>


      <button type="submit" class="submit-btn">
        Login
      </button>

    </form>


    <form class="auth-form hidden" id="signupForm">

      <div class="field">

        <label for="ownerName">
          Owner Name
        </label>

        <input
          type="text"
          id="ownerName"
          placeholder="Enter your full name"
          required
        >

      </div>


      <div class="field">

        <label for="ownerPhone">
          Phone Number
        </label>

        <input
          type="tel"
          id="ownerPhone"
          placeholder="Enter your phone number"
          required
        >

      </div>


      <div class="field">

        <label for="ownerEmail">
          Email Address
        </label>

        <input
          type="email"
          id="ownerEmail"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="field">

        <label for="signupPassword">
          Create Password
        </label>

        <input
          type="password"
          id="signupPassword"
          placeholder="Create a password"
          required
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          required
        >

      </div>


      <label class="terms">

        <input type="checkbox" required>

        <span>
          I agree to the JaipurStays
          <a href="#">Terms</a>
          and
          <a href="#">Privacy Policy</a>.
        </span>

      </label>


      <button type="submit" class="submit-btn">
        Create Account
      </button>

    </form>


    <div class="secure-note">
      🔒 Your information is kept secure
    </div>

  </div>

</main>


<footer class="footer">

  <div class="container">

    <p>
      © 2026 JaipurStays. All rights reserved.
    </p>

  </div>

</footer>


<script>

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

loginTab.addEventListener("click", function() {

  loginTab.classList.add("active");
  signupTab.classList.remove("active");

  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");

});


signupTab.addEventListener("click", function() {

  signupTab.classList.add("active");
  loginTab.classList.remove("active");

  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");

});


signupForm.addEventListener("submit", function(event) {

  event.preventDefault();

  const password = document.getElementById("signupPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {

    alert("Passwords do not match.");

    return;

  }

  alert("Account created successfully.");

  window.location.href = "dashboard.html";

});


loginForm.addEventListener("submit", function(event) {

  event.preventDefault();

  alert("Login successful.");

  window.location.href = "dashboard.html";

});

</script>

</body>
</html>
